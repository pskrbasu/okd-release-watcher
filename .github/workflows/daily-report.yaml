name: Daily OKD Release Report

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 9 AM UTC, weekdays
  workflow_dispatch:          # manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o okd-release-watcher ./cmd/okd-release-watcher

      - name: Generate report
        run: |
          ./okd-release-watcher report --slack > slack-message.txt 2>build.log
          cat build.log || true
          echo "--- Slack message ---"
          cat slack-message.txt

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site
          cp report.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          REPORT=$(cat slack-message.txt)
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text "$REPORT" '{text: $text}')"
